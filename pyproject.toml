[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitles-studio"
version = "2.0.0"
description = "Legendas dinâmicas estilo Lockup para Reels/Shorts no HyperFrames, com projeto editável no Studio e b-rolls em tela cheia"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fonttools>=4.40.0",
    "brotli>=1.0.9",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["caption_kit*"]
